<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大场投流工具 · 产品能力矩阵</title>
<style>
  :root{
    --cream:#FFF9E3;
    --cream-2:#FDF6CF;
    --blue:#C7ECFF;
    --blue-2:#EAF6FF;
    --blue-deep:#2E7CB6;
    --ink:#1f2937;
    --ink-soft:#595959;
    --line:#e8e3cf;
    --shadow:0 10px 30px rgba(46,124,182,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, #ffe9a8 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 10%, #c7ecff 0%, transparent 55%),
      linear-gradient(180deg, #fff9e3 0%, #fdf6cf 35%, #f4f7fb 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* 顶部 —— 还原文档开头的"产品封面 + 标题"氛围 */
  .hero{
    position:relative;
    padding:48px 32px 28px;
    text-align:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 12% 20%, rgba(199,236,255,.85), transparent 35%),
      radial-gradient(circle at 88% 30%, rgba(255,249,227,1), transparent 40%);
    z-index:-1;
  }
  .hero .tag{
    display:inline-block;
    background:var(--blue);
    color:#0f3b66;
    font-weight:600;
    font-size:13px;
    padding:6px 14px;
    border-radius:999px;
    letter-spacing:1px;
    margin-bottom:18px;
  }
  .hero h1{
    margin:0 0 12px;
    font-size:clamp(24px,3.4vw,38px);
    font-weight:800;
    letter-spacing:.5px;
    color:#102a43;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .hero .lead{
    display:inline-block;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(46,124,182,.18);
    border-radius:14px;
    padding:14px 22px;
    backdrop-filter:blur(4px);
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.85;
  }
  .hint{
    margin:6px auto 0;
    text-align:center;
    color:#0f3b66;
    font-size:13px;
    opacity:.85;
  }
  .hint b{color:#0f3b66}

  /* 矩阵区 */
  .matrix{
    max-width:1200px;
    margin:24px auto 60px;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
    align-items:start;
  }
  @media (max-width:880px){
    .matrix{grid-template-columns:1fr}
  }

  .scene{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(46,124,182,.18);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
    backdrop-filter:blur(6px);
    display:flex;
    flex-direction:column;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .scene.active{
    box-shadow:0 14px 38px rgba(46,124,182,.22);
    border-color:rgba(46,124,182,.5);
  }
  .scene header{
    padding:18px 22px 14px;
    background:linear-gradient(180deg, rgba(199,236,255,.65), rgba(199,236,255,0));
    border-bottom:1px dashed rgba(46,124,182,.25);
  }
  .scene header .row{
    display:flex;align-items:center;gap:10px;
    color:#0f3b66;
    font-weight:700;
    font-size:15px;
  }
  .scene header .emoji{
    width:30px;height:30px;border-radius:8px;
    background:var(--blue);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .scene header .pain{
    margin-top:10px;
    font-size:13.5px;
    color:#4b5563;
    line-height:1.7;
    background:#FFFDF4;
    border-left:3px solid #f0c75e;
    padding:8px 12px;
    border-radius:6px;
  }

  .chips{
    padding:16px 18px 6px;
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .chip{
    --bg:#EAF6FF;
    --fg:#0f3b66;
    appearance:none;
    border:1px solid rgba(46,124,182,.25);
    background:var(--bg);
    color:var(--fg);
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    padding:9px 14px;
    border-radius:10px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
    line-height:1.2;
  }
  .chip:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 16px rgba(46,124,182,.18);
    background:#D9EEFF;
  }
  .chip[aria-pressed="true"]{
    background:#2E7CB6;
    color:#fff;
    border-color:#2E7CB6;
    box-shadow:0 6px 16px rgba(46,124,182,.35);
  }
  .chip .star{color:#e8a200;margin-right:6px;font-size:12px}
  .chip[aria-pressed="true"] .star{color:#ffd966}
  .chip.warm{--bg:#FFF3C9;--fg:#7a5b00;border-color:rgba(184,134,11,.25)}
  .chip.warm:hover{background:#FFE9A0}
  .chip.has-img::after{
    content:"🖼";
    font-size:11px;
    margin-left:6px;
    opacity:.75;
  }

  /* ===== 内嵌详情：紧跟在场景后面 ===== */
  .detail-inline{
    display:none;
    margin:12px 18px 18px;
    background:#fff;
    border:1px solid rgba(46,124,182,.18);
    border-radius:14px;
    overflow:hidden;
    animation:slideIn .25s ease both;
  }
  .detail-inline.show{display:block}
  @keyframes slideIn{
    from{opacity:0;transform:translateY(6px)}
    to{opacity:1;transform:translateY(0)}
  }
  .detail-inline .head{
    background:linear-gradient(135deg,#C7ECFF 0%, #FFF9E3 100%);
    padding:12px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    border-bottom:1px solid rgba(46,124,182,.15);
  }
  .detail-inline .head h3{
    margin:0;font-size:15.5px;color:#0f3b66;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .detail-inline .head .pill{
    background:rgba(255,255,255,.7);
    color:#0f3b66;
    border:1px solid rgba(46,124,182,.25);
    font-size:11.5px;font-weight:500;
    padding:2px 9px;border-radius:999px;
  }
  .detail-inline .close{
    border:none;background:rgba(255,255,255,.75);
    width:28px;height:28px;border-radius:50%;
    font-size:15px;color:#0f3b66;cursor:pointer;
    transition:background .2s;flex-shrink:0;
  }
  .detail-inline .close:hover{background:#fff}

  .detail-inline .body{
    padding:14px 16px 16px;
    display:grid;grid-template-columns:1.2fr 1fr;gap:14px;
  }
  @media (max-width:640px){.detail-inline .body{grid-template-columns:1fr}}
  .detail-inline h4{
    margin:0 0 8px;font-size:12px;color:#0f3b66;
    text-transform:uppercase;letter-spacing:1px;font-weight:700;
  }
  .detail-inline .advice{
    background:#F8FBFF;border:1px solid #E1EEF9;border-radius:10px;
    padding:12px 14px;color:#243b53;font-size:13.5px;line-height:1.85;
  }
  .detail-inline .advice .key{color:#0f3b66;font-weight:700}
  .detail-inline .ref{
    background:#FFFDF4;border:1px solid #F1E4B5;border-radius:10px;
    padding:12px 14px;
  }
  .detail-inline .ref a{
    display:inline-flex;align-items:flex-start;gap:8px;
    color:#b45309;font-weight:600;text-decoration:none;
    word-break:break-all;font-size:13.5px;line-height:1.6;
  }
  .detail-inline .ref a:hover{text-decoration:underline}
  .detail-inline .ref .ico{
    width:22px;height:22px;border-radius:6px;background:#FFE9A0;color:#7a5b00;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;
    flex-shrink:0;margin-top:2px;
  }
  .detail-inline .ref a + a{margin-top:10px}
  .detail-inline .ref .empty{color:#9ca3af;font-size:13px}
  .detail-inline .meta{
    margin-top:8px;font-size:11.5px;color:#6b7280;
  }

  /* ===== 产品截图（缩略图 + 点击放大） ===== */
  .imgs{
    grid-column:1 / -1;
    border-top:1px dashed rgba(46,124,182,.2);
    padding-top:12px;
  }
  .imgs h4{margin-bottom:8px}
  .thumbs{
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .thumb{
    position:relative;
    border:1px solid rgba(46,124,182,.25);
    border-radius:10px;
    overflow:hidden;
    cursor:zoom-in;
    padding:0;
    background:#F8FBFF;
    transition:transform .15s ease, box-shadow .15s ease;
    max-width:240px;
    flex:1 1 160px;
    min-width:120px;
  }
  .thumb:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(46,124,182,.2);
  }
  .thumb img{
    display:block;width:100%;height:110px;object-fit:cover;object-position:top;
    background:#fff;
  }
  .thumb .zoom{
    position:absolute;right:6px;bottom:6px;
    background:rgba(15,59,102,.75);color:#fff;
    font-size:11px;padding:2px 7px;border-radius:6px;
    display:flex;align-items:center;gap:3px;
  }
  .thumb figcaption{
    font-size:11px;color:#64748b;padding:5px 8px 6px;
    text-align:center;background:#F8FBFF;
  }

  /* ===== 灯箱 ===== */
  .lightbox{
    display:none;
    position:fixed;inset:0;z-index:100;
    background:rgba(10,25,47,.82);
    backdrop-filter:blur(3px);
    align-items:center;justify-content:center;
    flex-direction:column;
    padding:32px;
    cursor:zoom-out;
  }
  .lightbox.show{display:flex}
  .lightbox img{
    max-width:92vw;max-height:80vh;
    border-radius:10px;
    box-shadow:0 24px 80px rgba(0,0,0,.5);
    background:#fff;
  }
  .lightbox .cap{
    color:#dbeafe;font-size:13.5px;margin-top:14px;
    text-align:center;
  }
  .lightbox .x{
    position:absolute;top:18px;right:22px;
    width:38px;height:38px;border-radius:50%;
    border:none;background:rgba(255,255,255,.15);color:#fff;
    font-size:18px;cursor:pointer;
  }
  .lightbox .x:hover{background:rgba(255,255,255,.3)}

  footer{
    text-align:center;color:#6b7280;font-size:12px;padding:20px 0 40px;
  }
</style>
</head>

  <span class="tag">阶段二 · 大场爆发</span>
  <h1>需求场景 ✖️ ADQ 产品能力 Mapping</h1>

/* ========== 渲染矩阵（每个场景自带内嵌详情区） ========== */
const matrixEl = document.getElementById("matrix");
DATA.forEach(scene => {
  const card = document.createElement("article");
  card.className = "scene";
  card.dataset.id = scene.id;
  card.innerHTML = `
    <header>
      <div class="row"><span class="emoji">${scene.icon}</span><span>${scene.scene}</span></div>
      <div class="pain">痛点 / 需求：${scene.pain}</div>
    </header>
    <div class="chips">
      ${scene.products.map(p=>`
        <button class="chip ${p.warm?'warm':''} ${IMGS[p.name]?'has-img':''}"
                data-scene="${scene.id}" data-name="${p.name}"
                aria-pressed="false">
          ${p.warm?'<span class="star">★</span>':''}${p.name}
        </button>
      `).join("")}
    </div>
    <div class="detail-inline" id="detail-${scene.id}"></div>
  `;
  matrixEl.appendChild(card);
});

/* ========== 详情交互（就地展开） ========== */
function escapeHTML(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function linkifyAdvice(text){
  return escapeHTML(text)
    .replace(/(✅|🚩|⚠️|优势：|使用建议：|操作建议：)/g, '<span class="key">$1</span>')
    .replace(/\n/g,"<br/>");
}

function showDetail(sceneId, prodName){
  const scene = DATA.find(s => s.id === sceneId);
  const prod = scene.products.find(p => p.name === prodName);
  if(!prod) return;

  const box = document.getElementById("detail-" + sceneId);
  const isSame = box.dataset.name === prodName && box.classList.contains("show");

  if(isSame){ closeDetail(sceneId); return; }

  DATA.forEach(s => { if(s.id !== sceneId) closeDetail(s.id); });

  box.dataset.name = prodName;
  box.classList.add("show");
  document.querySelectorAll(`.chip[data-scene="${sceneId}"]`)
    .forEach(b => b.setAttribute("aria-pressed", b.dataset.name===prodName ? "true":"false"));
  document.querySelectorAll(".scene")
    .forEach(s => s.classList.toggle("active", s.dataset.id===sceneId));

  const imgs = IMGS[prodName] || [];
  const refs = Array.isArray(prod.ref) ? prod.ref : (prod.ref ? [prod.ref] : []);

  box.innerHTML = `
    <div class="head">
      <h3>${escapeHTML(prod.name)} <span class="pill">${refs.length ? (refs.length > 1 ? `含 ${refs.length} 篇文档` : "含参考文档") : "平台能力"}</span></h3>
      <button class="close" aria-label="收起">✕</button>
    </div>
    <div class="body">
      <div>
        <h4>使用建议</h4>
        <div class="advice">${linkifyAdvice(prod.advice)}</div>
      </div>
      <div>
        <h4>参考文档${refs.length > 1 ? `（${refs.length} 篇）` : ""}</h4>
        <div class="ref">
          ${refs.length ? refs.map(r => `
            <a href="${r.url}" target="_blank" rel="noopener">
              <span class="ico">↗</span><span>${escapeHTML(r.title)}</span>
            </a>`).join("") + `
            <div class="meta">点击跳转微信文档</div>` : `
            <span class="empty">能力已全量</span>
          `}
        </div>
      </div>
      ${imgs.length ? `
      <div class="imgs">
        <h4>产品截图（点击放大）</h4>
        <div class="thumbs">
          ${imgs.map((im,i)=>`
            <figure class="thumb" data-img="${i}">
              <img src="${im.b64}" alt="${escapeHTML(im.cap)}" loading="lazy"/>
              <span class="zoom">🔍 放大</span>
              <figcaption>${escapeHTML(im.cap)}</figcaption>
            </figure>
          `).join("")}
        </div>
      </div>` : ""}
    </div>
  `;

  box.querySelector(".close").addEventListener("click", () => closeDetail(sceneId));

  /* 缩略图点击 → 灯箱放大 */
  box.querySelectorAll(".thumb").forEach(fig => {
    fig.addEventListener("click", () => {
      const im = imgs[+fig.dataset.img];
      openLightbox(im.b64, `${prod.name} · ${im.cap}`);
    });
  });
}

function closeDetail(sceneId){
  const box = document.getElementById("detail-" + sceneId);
  box.classList.remove("show");
  box.innerHTML = "";
  delete box.dataset.name;
  document.querySelectorAll(`.chip[data-scene="${sceneId}"]`)
    .forEach(b => b.setAttribute("aria-pressed","false"));
  const card = document.querySelector(`.scene[data-id="${sceneId}"]`);
  if(card) card.classList.remove("active");
}

/* ========== 灯箱 ========== */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const lightboxCap = document.getElementById("lightboxCap");

function openLightbox(src, cap){
  lightboxImg.src = src;
  lightboxCap.textContent = cap || "";
  lightbox.classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeLightbox(){
  lightbox.classList.remove("show");
  lightboxImg.src = "";
  document.body.style.overflow = "";
}
lightbox.addEventListener("click", e => {
  if(e.target === lightbox || e.target.classList.contains("x")) closeLightbox();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeLightbox();
});

document.addEventListener("click", e=>{
  const btn = e.target.closest(".chip");
  if(!btn) return;
  showDetail(btn.dataset.scene, btn.dataset.name);
});
</script>
